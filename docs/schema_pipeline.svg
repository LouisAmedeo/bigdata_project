<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Schéma du pipeline pour le rapport (prévu pour ~17 cm de large sur A4).
       Rectangles = traitements, cylindres = stockage S3, étapes numérotées comme run_pipeline.sh -->
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .tag { font-size: 13px; font-weight: bold; letter-spacing: .4px; fill: #666; }
      .tit { font-size: 17px; font-weight: bold; fill: #1f1f1f; }
      .txt { font-size: 15px; fill: #2b2b2b; }
      .lbl { font-size: 14px; fill: #444; font-style: italic; }
      .fl  { stroke: #555; stroke-width: 1.8; fill: none; marker-end: url(#fl); }
      .src { fill: #eeeeee; stroke: #888; stroke-width: 1.5; }
      .job { fill: #e1ebf7; stroke: #3b6ea8; stroke-width: 1.5; }
      .s3  { fill: #f8ecd4; stroke: #b07a1f; stroke-width: 1.5; }
      .chk { fill: #e2f1e3; stroke: #3c8a46; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1040" height="490" fill="#fff"/>

  <!-- cadre Onyxia -->
  <rect x="204" y="14" width="828" height="424" rx="10" fill="#fafbfc" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="220" y="40" class="tag">ONYXIA · NAMESPACE KUBERNETES ET BUCKET S3 user-&lt;id&gt;</text>

  <!-- ===== rangée 1 : chaîne principale ===== -->
  <rect class="src" x="10" y="70" width="180" height="130" rx="8"/>
  <text x="22" y="92" class="tag">SOURCE PUBLIQUE</text>
  <text x="22" y="116" class="tit">SNCF Open Data</text>
  <text x="22" y="140" class="txt">régularité des TGV</text>
  <text x="22" y="162" class="txt">CSV de 2,9 Mo</text>
  <text x="22" y="184" class="txt">2018 → 2026</text>

  <rect class="job" x="216" y="70" width="180" height="130" rx="8"/>
  <text x="228" y="92" class="tag">ÉTAPE 2 · JOB K8S</text>
  <text x="228" y="116" class="tit">Ingestion</text>
  <text x="228" y="140" class="txt">téléchargement</text>
  <text x="228" y="162" class="txt">contrôle du sha256</text>
  <text x="228" y="184" class="txt">dépôt sur S3</text>

  <path class="s3" d="M422,80 V192 A90,11 0 0 0 602,192 V80"/>
  <ellipse class="s3" cx="512" cy="80" rx="90" ry="11"/>
  <text x="434" y="112" class="tag">S3 · raw/</text>
  <text x="434" y="136" class="tit">Données brutes</text>
  <text x="434" y="160" class="txt">CSV inchangé</text>
  <text x="434" y="182" class="txt">+ fichier .meta</text>

  <rect class="job" x="628" y="70" width="180" height="130" rx="8"/>
  <text x="640" y="92" class="tag">ÉTAPE 3 · JOB SPARK</text>
  <text x="640" y="116" class="tit">Nettoyage + calcul</text>
  <text x="640" y="140" class="txt">11 règles qualité</text>
  <text x="640" y="162" class="txt">agrégats par liaison</text>
  <text x="640" y="184" class="txt">2018-19 / 2024-25</text>

  <path class="s3" d="M834,80 V192 A90,11 0 0 0 1014,192 V80"/>
  <ellipse class="s3" cx="924" cy="80" rx="90" ry="11"/>
  <text x="846" y="106" class="tag">S3 · processed/</text>
  <text x="846" y="128" class="tit">Résultats</text>
  <text x="846" y="150" class="txt">silver/ Parquet</text>
  <text x="846" y="169" class="txt">gold/ 121 liaisons</text>
  <text x="846" y="188" class="txt">quality/ rapport</text>

  <path class="fl" d="M190,135 H214"/>
  <path class="fl" d="M396,135 H420"/>
  <path class="fl" d="M602,135 H626"/>
  <path class="fl" d="M808,135 H832"/>

  <!-- ===== rangée 2 : contrôles ===== -->
  <rect class="chk" x="10" y="300" width="180" height="120" rx="8"/>
  <text x="22" y="322" class="tag">ÉTAPE 1 · POSTE LOCAL</text>
  <text x="22" y="346" class="tit">Calcul à la main</text>
  <text x="22" y="370" class="txt">copie du CSV brut</text>
  <text x="22" y="392" class="txt">Python pur</text>
  <text x="22" y="412" class="txt">liaison n°1 seule</text>

  <rect class="chk" x="216" y="300" width="386" height="96" rx="8"/>
  <text x="228" y="322" class="tag">MESURES · JOB K8S</text>
  <text x="228" y="346" class="tit">Banc d'essai</text>
  <text x="228" y="368" class="txt">pandas, DuckDB et Spark, en CSV et Parquet</text>
  <text x="228" y="388" class="txt">volumes ×1, ×10, ×100 → processed/benchmark/</text>

  <rect class="chk" x="628" y="300" width="180" height="120" rx="8"/>
  <text x="640" y="322" class="tag">ÉTAPE 4 · DUCKDB</text>
  <text x="640" y="346" class="tit">Recalcul en SQL</text>
  <text x="640" y="370" class="txt">depuis le CSV brut</text>
  <text x="640" y="392" class="txt">comparé au gold</text>
  <text x="640" y="412" class="txt">écart &lt; 10⁻⁶</text>

  <rect x="834" y="300" width="180" height="120" rx="8" fill="#fff" stroke="#3c8a46" stroke-width="2.6"/>
  <text x="846" y="322" class="tag">RÉSULTAT VÉRIFIÉ</text>
  <text x="846" y="346" class="tit" style="font-size:15.5px">Paris Est → Stuttgart</text>
  <text x="846" y="370" class="txt">85,6 % → 62,6 %</text>
  <text x="846" y="392" class="txt">à l'heure : −23 pts</text>
  <text x="846" y="412" class="txt">cause : externe</text>

  <!-- flux vers les contrôles -->
  <path class="fl" d="M100,200 V298"/>
  <path class="fl" d="M470,204 V298"/>
  <path class="fl" d="M560,204 L668,298"/>
  <text x="612" y="258" class="lbl" text-anchor="end">relit le brut</text>
  <path class="fl" d="M890,206 L784,298"/>
  <text x="852" y="262" class="lbl">lit le gold</text>
  <path class="fl" d="M808,360 H832"/>

  <!-- le calcul à la main confirme aussi le résultat -->
  <path class="fl" d="M100,420 V456 H924 V422"/>
  <text x="512" y="478" class="lbl" text-anchor="middle">même valeur que Spark et DuckDB : −23,011 points</text>
</svg>
